title: Karim Osman
description: "Karim Osman — MBA candidate at London Business School with experience in strategy, AI operations, and analytics."
url: "https://karimosman1.github.io"
baseurl: ""
lang: en
author:
  name: Karim Osman

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

navigation:
  - title: Home
    url: /#home
  - title: About
    url: /#about
  - title: Work Experience
    url: /#experience
  - title: Contact
    url: /#contact

defaults:
  - scope:
      path: ""
      type: pages
    values:
