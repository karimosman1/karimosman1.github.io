<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  </head>
  <body>
    <main class="site-main">
      <article class="page-content">
        <h1>{{ page.title | escape }}</h1>
        <p>This section is now part of the <a href="{{ page.redirect_to | relative_url }}">main portfolio page</a>.</p>
      </article>
    </main>
  </body>
</html>
